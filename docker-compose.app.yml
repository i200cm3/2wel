# App-стек 2wel на 192.168.2.6 (прод).
# TLS и ACME остаются на edge (192.168.2.8): host nginx → этот web:8086.
#
# Запуск:
#   docker compose -f docker-compose.app.yml up -d --build
#
# В .env обязательно:
#   GUEST_SSL_ENSURE_URL=http://192.168.2.8:9299
#   ENSURE_GUEST_SSL=1
#   (тот же AUTH_SECRET, что на edge guest-ssl)

services:
  db:
    image: postgres:16-alpine
    container_name: promo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-promo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-promo}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - promo-net

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        API_CACHEBUST: ${API_CACHEBUST:-1}
    container_name: promo-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
      PUBLIC_DIR: /data/public
      DATABASE_URL: postgres://${POSTGRES_USER:-promo}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-promo}
      # Edge guest-ssl на 2.8 (сертификаты + reload host nginx).
      GUEST_SSL_ENSURE_URL: ${GUEST_SSL_ENSURE_URL:-http://192.168.2.8:9299}
      ENSURE_GUEST_SSL: ${ENSURE_GUEST_SSL:-1}
    volumes:
      - ./web/public:/data/public
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - promo-net

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: promo-web
    restart: unless-stopped
    environment:
      - YOUR_DOMAIN=${DOMAIN:-2wel.ru}
    ports:
      - "${PROMO_PORT:-8086}:80"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./web/public/media:/usr/share/nginx/html/media
      - ./web/public/properties:/usr/share/nginx/html/properties
      - ./web/public/s:/usr/share/nginx/html/s
    networks:
      - promo-net

volumes:
  postgres-data:

networks:
  promo-net:
    driver: bridge
    name: promo-net
