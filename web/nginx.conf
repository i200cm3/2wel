# Host nginx terminates TLS and sets X-Forwarded-Proto: https.
# Inner $scheme is always http (listen 80) — pass the outer header through.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 300m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Docker embedded DNS — иначе nginx резолвит `api` один раз на старте
    # и падает, если контейнер API ещё нет / сменил IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ^~ /api/ {
        set $api_backend api:3000;
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        client_max_body_size 300m;
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    location = /health {
        set $api_backend api:3000;
        proxy_pass http://$api_backend/health;
        access_log off;
    }

    # Иначе location *.jpg отдаст 404 из статики и не дойдёт до API.
    location ~* "^/[a-z0-9]{3,16}/preview\.jpe?g$" {
        set $api_backend api:3000;
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location ^~ /properties/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ^~ /s/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ^~ /media/ {
        add_header Cache-Control "public, max-age=86400";

        # Озвучка проектов — только через API. Статические демо голосов в кабинете — /media/tts/demos/.
        location ~ ^/media/tts/(?!demos/) {
            return 404;
        }
        location ~ ^/media/projects/[^/]+/tts {
            return 404;
        }

        try_files $uri =404;
    }

    # Favicons change without hashed filenames — don't pin them for a year.
    location ~* ^/(favicon[^/]*|apple-touch-icon\.png)$ {
        add_header Cache-Control "public, max-age=86400";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif|mp3|wav|ogg|m4a|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
